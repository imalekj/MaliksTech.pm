# Note: the live deployment uses an external Neon Postgres database (free tier,
# no card required) rather than Render's own Postgres add-on, since Render only
# allows one free-tier database per account. Set ConnectionStrings__DefaultConnection
# below to your own Postgres URL (Neon, Render Postgres, or otherwise).
services:
  - type: web
    name: malikstech-pm-api
    runtime: docker
    dockerfilePath: ./MaliksTech.PM.Api/Dockerfile
    dockerContext: ./MaliksTech.PM.Api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: MaliksTechPM
      - key: Jwt__Audience
        value: MaliksTechPM
      - key: Gemini__ApiKey
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
